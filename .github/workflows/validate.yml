name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate committed JSON catalog
        run: node --input-type=module -e "import { readFileSync } from 'fs'; import { parseAdvisorCatalog } from './lib/src/index.ts'; const c = parseAdvisorCatalog(JSON.parse(readFileSync('catalog/advisor.json','utf8'))); if (!c.steps.length) throw new Error('empty'); console.log('OK', c.steps.length, 'steps');"
